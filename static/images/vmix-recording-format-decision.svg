<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<rect width="900" height="470" rx="14" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6572"/></marker></defs>
<text x="450.0" y="32" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700">녹화 목적에 따라 포맷을 고르면 화질·용량 문제가 같이 풀립니다</text>
<rect x="330" y="60" width="240" height="64" rx="10" fill="#eef0f3" stroke="#1f2937" stroke-width="1.5"/>
<text x="450.0" y="86" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">이 녹화 파일을 어디에 쓰나?</text>
<text x="450.0" y="108" font-size="12" fill="#1f2937" text-anchor="middle">유튜브 업로드? 편집? 둘 다?</text>
<rect x="20" y="190" width="260" height="150" rx="10" fill="#e3f4e8" stroke="#1e8e3e" stroke-width="1.5"/>
<text x="150.0" y="216" font-size="14" fill="#1e8e3e" text-anchor="middle" font-weight="700">업로드·보관만</text>
<text x="150.0" y="238" font-size="12" fill="#1f2937" text-anchor="middle">MP4 · H.264 하드웨어 인코더</text>
<text x="150.0" y="256" font-size="12" fill="#1f2937" text-anchor="middle">1080p30 25 Mbps / 1080p60 35~50 Mbps</text>
<text x="150.0" y="274" font-size="12" fill="#1f2937" text-anchor="middle">NVENC P5~P7 · Main/High 프로파일</text>
<text x="150.0" y="292" font-size="12" fill="#1f2937" text-anchor="middle">Fault Tolerant + New File Every 30분</text>
<text x="150.0" y="310" font-size="12" fill="#1f2937" text-anchor="middle">1시간 ≈ 11~22 GB</text>
<rect x="320" y="190" width="260" height="150" rx="10" fill="#e3ecfb" stroke="#1a56c4" stroke-width="1.5"/>
<text x="450.0" y="216" font-size="14" fill="#1a56c4" text-anchor="middle" font-weight="700">편집 마스터</text>
<text x="450.0" y="238" font-size="12" fill="#1f2937" text-anchor="middle">vMix AVI 로 녹화 (CPU 15% 수준)</text>
<text x="450.0" y="256" font-size="12" fill="#1f2937" text-anchor="middle">편집 PC에 vMix 설치만 하면 바로 편집</text>
<text x="450.0" y="274" font-size="12" fill="#1f2937" text-anchor="middle">맥·외부 편집자 → Media Converter로</text>
<text x="450.0" y="292" font-size="12" fill="#1f2937" text-anchor="middle">ProRes 422 MOV 변환</text>
<text x="450.0" y="310" font-size="12" fill="#1f2937" text-anchor="middle">1시간 ≈ 55 GB (1080p30)</text>
<rect x="620" y="190" width="260" height="150" rx="10" fill="#fdf0e1" stroke="#b35c00" stroke-width="1.5"/>
<text x="750.0" y="216" font-size="14" fill="#b35c00" text-anchor="middle" font-weight="700">둘 다 필요</text>
<text x="750.0" y="238" font-size="12" fill="#1f2937" text-anchor="middle">Second Recorder (4K 에디션 이상)</text>
<text x="750.0" y="256" font-size="12" fill="#1f2937" text-anchor="middle">1번: MP4 25 Mbps (배포용)</text>
<text x="750.0" y="274" font-size="12" fill="#1f2937" text-anchor="middle">2번: vMix AVI (마스터)</text>
<text x="750.0" y="292" font-size="12" fill="#1f2937" text-anchor="middle">시작·정지는 같이 움직임</text>
<text x="750.0" y="310" font-size="12" fill="#1f2937" text-anchor="middle">1시간 ≈ 66 GB</text>
<path d="M400,124 L150,190" stroke="#5b6572" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="229.0" y="146.0" width="92" height="22" rx="11" fill="#ffffff" stroke="#d5dae1"/>
<text x="275.0" y="161.0" font-size="11" fill="#5b6572" text-anchor="middle" font-weight="700">업로드</text>
<path d="M450,124 L450,190" stroke="#5b6572" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="404.0" y="146.0" width="92" height="22" rx="11" fill="#ffffff" stroke="#d5dae1"/>
<text x="450.0" y="161.0" font-size="11" fill="#5b6572" text-anchor="middle" font-weight="700">편집</text>
<path d="M500,124 L750,190" stroke="#5b6572" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="579.0" y="146.0" width="92" height="22" rx="11" fill="#ffffff" stroke="#d5dae1"/>
<text x="625.0" y="161.0" font-size="11" fill="#5b6572" text-anchor="middle" font-weight="700">둘 다</text>
<rect x="20" y="368" width="860" height="78" rx="10" fill="#fff7f7" stroke="#d9572b" stroke-width="1.5"/>
<text x="36" y="394" font-size="13" fill="#d9572b" font-weight="700">어느 쪽이든 먼저 확인할 것</text>
<text x="36" y="416" font-size="12" fill="#1f2937">① 1080i 소스는 프로그레시브로 바꿔서 녹화 (MP4는 인터레이스 미지원)   ② 녹화 로그의 드롭 프레임 → SSD·출력 수 줄이기·하드웨어 인코더</text>
<text x="36" y="436" font-size="12" fill="#1f2937">③ 용량 계산: 비트레이트(Mbps) × 0.45 = 1시간당 GB   ④ MOV가 큰 건 ProRes·DNxHD 편집용 코덱 때문이며 정상</text>
</svg>
