<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<rect width="900" height="460" rx="14" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6572"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6572"/></marker></defs>
<text x="450.0" y="30" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700">NDI 네트워크 설계: 채널당 대역폭을 더해서 스위치 한계부터 확인합니다</text>
<rect x="20" y="60" width="200" height="52" rx="10" fill="#eef0f3" stroke="#1f2937" stroke-width="1.5"/>
<text x="120.0" y="81" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">카메라 1 · Full NDI</text>
<text x="120.0" y="100" font-size="12" fill="#1f2937" text-anchor="middle">1080p60 ≈ 130 Mbps / 채널</text>
<path d="M220,86 L280,86" stroke="#5b6572" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="20" y="122" width="200" height="52" rx="10" fill="#eef0f3" stroke="#1f2937" stroke-width="1.5"/>
<text x="120.0" y="143" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">카메라 2 · NDI HX2</text>
<text x="120.0" y="162" font-size="12" fill="#1f2937" text-anchor="middle">1080p60 ≈ 16 Mbps / 채널</text>
<path d="M220,148 L280,148" stroke="#5b6572" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="20" y="184" width="200" height="52" rx="10" fill="#eef0f3" stroke="#1f2937" stroke-width="1.5"/>
<text x="120.0" y="205" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">PC · NDI HX3</text>
<text x="120.0" y="224" font-size="12" fill="#1f2937" text-anchor="middle">1080p60 ≈ 62 Mbps / 채널</text>
<path d="M220,210 L280,210" stroke="#5b6572" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="280" y="60" width="240" height="176" rx="10" fill="#e3ecfb" stroke="#1a56c4" stroke-width="1.5"/>
<text x="400.0" y="81" font-size="14" fill="#1a56c4" text-anchor="middle" font-weight="700">1GbE 매니지드 스위치</text>
<text x="400.0" y="100" font-size="12" fill="#1f2937" text-anchor="middle">유선 1GbE 포트 × N (와이파이 아님)</text>
<text x="400.0" y="117" font-size="12" fill="#1f2937" text-anchor="middle">모든 장비를 같은 서브넷에</text>
<text x="400.0" y="134" font-size="12" fill="#1f2937" text-anchor="middle">IGMP 스누핑 켜기 (멀티캐스트 시)</text>
<text x="400.0" y="151" font-size="12" fill="#1f2937" text-anchor="middle">스위치 한 대 = 1,000 Mbps 한도</text>
<text x="400.0" y="168" font-size="12" fill="#1f2937" text-anchor="middle">그 이상은 10GbE 업링크 + 10GbE NIC</text>
<path d="M520,148 L580,148" stroke="#5b6572" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="517.2" y="117" width="66" height="22" rx="11" fill="#ffffff" stroke="#d5dae1"/>
<text x="550" y="132" font-size="11" fill="#5b6572" text-anchor="middle" font-weight="700">NDI 수신</text>
<rect x="580" y="60" width="300" height="176" rx="10" fill="#e3f4e8" stroke="#1e8e3e" stroke-width="1.5"/>
<text x="730.0" y="81" font-size="14" fill="#1e8e3e" text-anchor="middle" font-weight="700">vMix PC</text>
<text x="730.0" y="100" font-size="12" fill="#1f2937" text-anchor="middle">NDI 입력 = 들어오는 채널 대역폭의 합</text>
<text x="730.0" y="117" font-size="12" fill="#1f2937" text-anchor="middle">Full NDI 4채널 수신 ≈ 520 Mbps</text>
<text x="730.0" y="134" font-size="12" fill="#1f2937" text-anchor="middle">1GbE NIC 한 장이면 4채널이 상한</text>
<text x="730.0" y="151" font-size="12" fill="#1f2937" text-anchor="middle">10GbE NIC + 10GbE 스위치로 확장</text>
<text x="730.0" y="168" font-size="12" fill="#1f2937" text-anchor="middle">NDI Tools 의 Discovery Server 권장</text>
<rect x="20" y="256" width="420" height="76" rx="10" fill="#fdf0e1" stroke="#b35c00" stroke-width="1.5"/>
<text x="230.0" y="277" font-size="14" fill="#b35c00" text-anchor="middle" font-weight="700">대역폭 계산</text>
<text x="230.0" y="296" font-size="12" fill="#1f2937" text-anchor="middle">1GbE ≈ 1,000 Mbps: Full NDI 4채널(≈520 Mbps)까지 안전</text>
<text x="230.0" y="313" font-size="12" fill="#1f2937" text-anchor="middle">6채널(≈780 Mbps)은 한계 → 그 이상은 10GbE 필요</text>
<rect x="460" y="256" width="420" height="76" rx="10" fill="#e3ecfb" stroke="#1a56c4" stroke-width="1.5"/>
<text x="670.0" y="277" font-size="14" fill="#1a56c4" text-anchor="middle" font-weight="700">NDI Bridge (원격 구간)</text>
<text x="670.0" y="296" font-size="12" fill="#1f2937" text-anchor="middle">현장 Host ↔ vMix 쪽 Join · 공인 IP + 포트 5990</text>
<text x="670.0" y="313" font-size="12" fill="#1f2937" text-anchor="middle">로컬 NDI 를 인터넷 너머로 전달, 양 끝은 각자 로컬 스위치</text>
<rect x="20" y="352" width="860" height="92" rx="10" fill="#fff7f7" stroke="#d9572b" stroke-width="1.5"/>
<text x="36" y="378" font-size="13" fill="#d9572b" text-anchor="start" font-weight="700">이렇게 하면 끊깁니다</text>
<text x="36" y="400" font-size="12" fill="#1f2937" text-anchor="start">① 와이파이로 NDI 송수신 금지 — 유선 1GbE 이상만 사용</text>
<text x="36" y="420" font-size="12" fill="#1f2937" text-anchor="start">② 가정용 공유기 한 대에 Full NDI 4채널 금지 — 스위칭 용량이 모자라 프레임이 떨어짐</text>
<text x="36" y="440" font-size="12" fill="#1f2937" text-anchor="start">③ 방화벽: 5353(mDNS), 5960~5990(NDI·Bridge) 허용. 막히면 소스 목록에 아예 안 보임</text>
</svg>
