<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<rect width="900" height="470" rx="14" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6572"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6572"/></marker></defs>
<text x="450.0" y="30" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700">프리셋 이중화: 같은 프리셋·같은 입력을 두 PC에, 스트림 키만 다르게</text>
<rect x="20" y="60" width="150" height="110" rx="10" fill="#eef0f3" stroke="#1f2937" stroke-width="1.5"/>
<text x="95.0" y="81" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">카메라</text>
<text x="95.0" y="100" font-size="12" fill="#1f2937" text-anchor="middle">SDI / NDI 출력</text>
<text x="95.0" y="117" font-size="12" fill="#1f2937" text-anchor="middle">자체 녹화 ON</text>
<text x="95.0" y="134" font-size="12" fill="#1f2937" text-anchor="middle">(SD 카드)</text>
<rect x="210" y="60" width="170" height="110" rx="10" fill="#e3ecfb" stroke="#1a56c4" stroke-width="1.5"/>
<text x="295.0" y="81" font-size="14" fill="#1a56c4" text-anchor="middle" font-weight="700">분배</text>
<text x="295.0" y="100" font-size="12" fill="#1f2937" text-anchor="middle">NDI: 스위치가 두 PC에</text>
<text x="295.0" y="117" font-size="12" fill="#1f2937" text-anchor="middle">같은 소스를 전달</text>
<text x="295.0" y="134" font-size="12" fill="#1f2937" text-anchor="middle">SDI: 분배기(DA) 1→2</text>
<text x="295.0" y="151" font-size="12" fill="#1f2937" text-anchor="middle">오디오도 같이 분배</text>
<path d="M170,115 L210,115" stroke="#5b6572" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="420" y="60" width="200" height="70" rx="10" fill="#e3f4e8" stroke="#1e8e3e" stroke-width="1.5"/>
<text x="520.0" y="81" font-size="14" fill="#1e8e3e" text-anchor="middle" font-weight="700">메인 vMix PC</text>
<text x="520.0" y="100" font-size="12" fill="#1f2937" text-anchor="middle">같은 프리셋 v1.3 · 같은 입력</text>
<text x="520.0" y="117" font-size="12" fill="#1f2937" text-anchor="middle">스트림 키 A (Primary ingest)</text>
<rect x="420" y="150" width="200" height="70" rx="10" fill="#fdf0e1" stroke="#b35c00" stroke-width="1.5"/>
<text x="520.0" y="171" font-size="14" fill="#b35c00" text-anchor="middle" font-weight="700">백업 vMix PC</text>
<text x="520.0" y="190" font-size="12" fill="#1f2937" text-anchor="middle">같은 프리셋 v1.3 · 같은 입력</text>
<text x="520.0" y="207" font-size="12" fill="#1f2937" text-anchor="middle">스트림 키 B (Backup ingest)</text>
<path d="M380,100 L420,95" stroke="#5b6572" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M380,130 L420,185" stroke="#5b6572" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="660" y="100" width="220" height="80" rx="10" fill="#eef0f3" stroke="#1f2937" stroke-width="1.5"/>
<text x="770.0" y="121" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">유튜브 라이브</text>
<text x="770.0" y="140" font-size="12" fill="#1f2937" text-anchor="middle">기본 + 백업 수신 서버</text>
<text x="770.0" y="157" font-size="12" fill="#1f2937" text-anchor="middle">또는 스트림 키 두 개</text>
<text x="770.0" y="174" font-size="12" fill="#1f2937" text-anchor="middle">같은 키 동시 송출은 금지</text>
<path d="M620,95 L660,125" stroke="#5b6572" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="610.0" y="75" width="60" height="22" rx="11" fill="#ffffff" stroke="#1e8e3e"/>
<text x="640" y="90" font-size="11" fill="#1e8e3e" text-anchor="middle" font-weight="700">송출 중</text>
<path d="M620,185 L660,160" stroke="#5b6572" stroke-width="1.8" fill="none" stroke-dasharray="5,4" marker-end="url(#a)"/>
<rect x="600.4" y="189" width="79" height="22" rx="11" fill="#ffffff" stroke="#b35c00"/>
<text x="640" y="204" font-size="11" fill="#b35c00" text-anchor="middle" font-weight="700">대기 (FTB)</text>
<rect x="20" y="244" width="380" height="92" rx="10" fill="#e3ecfb" stroke="#1a56c4" stroke-width="1.5"/>
<text x="210.0" y="265" font-size="14" fill="#1a56c4" text-anchor="middle" font-weight="700">녹화 이중화 (3중)</text>
<text x="210.0" y="284" font-size="12" fill="#1f2937" text-anchor="middle">① 메인 PC 녹화: MP4 + Fault Tolerant</text>
<text x="210.0" y="301" font-size="12" fill="#1f2937" text-anchor="middle">② 백업 PC 도 동시 녹화 (같은 설정)</text>
<text x="210.0" y="318" font-size="12" fill="#1f2937" text-anchor="middle">③ 카메라 자체 녹화 — 세 곳 중 한 곳만 살아도 복구</text>
<text x="650" y="240" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="700">장애 전환 절차 (메인 PC 가 멈췄을 때)</text>
<rect x="420" y="252" width="140" height="84" rx="10" fill="#fff7f7" stroke="#d9572b" stroke-width="1.5"/>
<text x="490.0" y="273" font-size="14" fill="#d9572b" text-anchor="middle" font-weight="700">1  FTB 전환</text>
<text x="490.0" y="292" font-size="12" fill="#1f2937" text-anchor="middle">대체 화면 + BGM</text>
<text x="490.0" y="309" font-size="12" fill="#1f2937" text-anchor="middle">시청자에게 안내</text>
<path d="M560,294 L590,294" stroke="#5b6572" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="590" y="252" width="140" height="84" rx="10" fill="#fdf0e1" stroke="#b35c00" stroke-width="1.5"/>
<text x="660.0" y="273" font-size="14" fill="#b35c00" text-anchor="middle" font-weight="700">2  백업 송출</text>
<text x="660.0" y="292" font-size="12" fill="#1f2937" text-anchor="middle">백업 PC 스트림 시작</text>
<text x="660.0" y="309" font-size="12" fill="#1f2937" text-anchor="middle">유튜브에서 수신 확인</text>
<path d="M730,294 L760,294" stroke="#5b6572" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="760" y="252" width="120" height="84" rx="10" fill="#e3f4e8" stroke="#1e8e3e" stroke-width="1.5"/>
<text x="820.0" y="273" font-size="14" fill="#1e8e3e" text-anchor="middle" font-weight="700">3  복구·복귀</text>
<text x="820.0" y="292" font-size="12" fill="#1f2937" text-anchor="middle">메인 PC 재시작</text>
<text x="820.0" y="309" font-size="12" fill="#1f2937" text-anchor="middle">쉬는 시간에 복귀</text>
<rect x="20" y="356" width="860" height="104" rx="10" fill="#fff7f7" stroke="#d9572b" stroke-width="1.5"/>
<text x="36" y="382" font-size="13" fill="#d9572b" text-anchor="start" font-weight="700">이중화가 무너지는 지점</text>
<text x="36" y="404" font-size="12" fill="#1f2937" text-anchor="start">① 바탕화면·다운로드 경로의 미디어 — 백업 PC 에는 그 파일이 없음 → 두 PC 같은 경로(D:\live\media)로 통일</text>
<text x="36" y="422" font-size="12" fill="#1f2937" text-anchor="start">② 백업 프리셋 버전 불일치 — 메인에서 고친 자막·오버레이가 백업엔 없음 → 리허설 직전 프리셋 복사·버전 표기</text>
<text x="36" y="440" font-size="12" fill="#1f2937" text-anchor="start">③ 스트림 키 동시 사용 — 같은 키로 둘이 보내면 유튜브가 둘 다 끊음 → 키 분리 또는 Primary/Backup ingest</text>
</svg>
