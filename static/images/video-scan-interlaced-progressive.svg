<text x="450" y="272" font-size="12" fill="#5b6572" text-anchor="middle">인터레이스는 반쪽 화면(필드) 두 장을 번갈아 보내 한 프레임을 만듭니다. 움직이는 장면을 멈춰 보면 줄무늬(코밍)가 생길 수 있습니다</text>
